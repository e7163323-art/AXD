name: העתקת מודל ל-GitHub (לאינטרנט מסונן)

# מוריד את המודל מ-HuggingFace בשרת של GitHub, מחלק לחלקים של פחות מ-2GB,
# ומעלה אותם ל-Release בשם gaon-models. ההתקנה של גאון מורידה משם ומחברת.
on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/mirror-model.yml" ]
  workflow_dispatch:
    inputs:
      file:
        description: "שם קובץ המודל"
        default: "Qwen2.5-Coder-7B-Instruct-Q5_K_M.gguf"
      repo:
        description: "מאגר ב-HuggingFace"
        default: "bartowski/Qwen2.5-Coder-7B-Instruct-GGUF"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: הורדה וחלוקה
        env:
          FILE: ${{ inputs.file || 'Qwen2.5-Coder-7B-Instruct-Q5_K_M.gguf' }}
          REPO: ${{ inputs.repo || 'bartowski/Qwen2.5-Coder-7B-Instruct-GGUF' }}
        run: |
          set -euo pipefail
          mkdir parts && cd parts
          df -h .
          # מחלקים תוך כדי הורדה – לא צריך מקום כפול בדיסק
          curl -L --fail --retry 10 -s -S "https://huggingface.co/$REPO/resolve/main/$FILE?download=true" \
            | split -b 1900M -d -a 2 - "$FILE.part"
          ls -la
          total=$(cat "$FILE".part* | wc -c)
          echo "total bytes: $total"
          test "$total" -gt 1000000000

      - name: העלאה ל-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gaon-models
          name: "מודלים לגאון (לאינטרנט מסונן)"
          make_latest: false
          body: "חלקי מודל שההתקנה של גאון מורידה ומחברת אוטומטית."
          files: parts/*.part*
